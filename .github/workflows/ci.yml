# Runs on every push and pull request. If any step fails, GitHub marks the commit red.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs exactly what package-lock.json says. No surprise upgrades.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      # The same date logic again, in a timezone with daylight saving (23- and 25-hour days).
      - run: npm run test:dst
      - run: npm run build
