  <circle cx="32" cy="32" r="17" fill="none" stroke="#3987e5" stroke-width="4"/>
  <g stroke="#ededed" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="7" x2="32" y2="15"/>
    <line x1="32" y1="49" x2="32" y2="57"/>
    <line x1="7" y1="32" x2="15" y2="32"/>
    <line x1="49" y1="32" x2="57" y2="32"/>
  </g>
  <circle cx="32" cy="32" r="5" fill="#ededed"/>
</svg>
